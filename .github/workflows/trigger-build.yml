name: Trigger website deploy
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: generate-token
        if: github.repository_owner == 'valkey-io'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: valkey-io.github.io
          permission-contents: write

      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ github.repository_owner == 'valkey-io' && steps.generate-token.outputs.token || secrets.DEPLOY_ACCESS_TOKEN }}
          repository: valkey-io/valkey-io.github.io
          event-type: deploy
