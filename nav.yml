# Menu structure for the documentation: topics and the commands related to them.
#
# Each entry is a first-level menu section:
#
#   id:       Stable identifier. Module docs use it to add topics to a section,
#             so don't rename it without updating them.
#   title:    Label shown in the menu.
#   landing:  Optional topic shown as the section's overview page.
#   commands: Optional commands belonging to the section as a whole (see below).
#             They're related to the landing page, if there is one.
#   topics:   Topics in menu order. Either a topic name (a file name in
#             topics/ without .md), or a mapping with "topic", an optional
#             shorter menu "title" and optional "commands".
#
# "commands" relates commands to a topic, for breadcrumbs and "see also" links.
# Each item is one of:
#
#   - a command group in lowercase, e.g. "list" (the "group" in the command JSON)
#   - a container command in uppercase, e.g. "ACL" for all ACL subcommands
#   - a command name in uppercase, e.g. "BGSAVE"
#
# The most specific item wins: a name over a container, a container over a group.
#
# Every topic should be listed exactly once, and every documented command (one
# with a page in commands/) should be covered exactly once at its most specific
# level. Topics and commands from modules are listed in the modules' own menu
# files. The website leaves out what doesn't fit; pages missing from the menu
# are still listed in the topic index and the command reference.

- id: getting-started
  title: Getting started
  topics:
    - introduction
    - quickstart
    - installation
    - faq
    - migration

